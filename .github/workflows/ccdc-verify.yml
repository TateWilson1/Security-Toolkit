name: Verify CCDC Windows Scripts
on:
  push:
    paths: ["windows/**", ".github/workflows/ccdc-verify.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/ccdc-verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax, configuration and payload integrity
        shell: powershell
        run: ./windows/tests/Test-Static.ps1
      - name: Telemetry and detection regressions
        shell: powershell
        run: |
          ./windows/tests/Test-Monitoring.ps1
          ./windows/tests/Test-DirectState.ps1
          ./windows/tests/Test-Baselines.ps1
          ./windows/tests/Test-Firewall.ps1
  integration:
    needs: validate
    # Installer resolves an actual repository commit, not GitHub's synthetic PR merge.
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Disposable Windows Server integration
        shell: powershell
        run: ./windows/tests/Test-WindowsIntegration.ps1 -Revision $env:GITHUB_SHA -AllowLabChanges -ResultsDirectory "$env:RUNNER_TEMP/ccdc-results"
      - name: Preserve actual results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccdc-windows-2022-results
          path: ${{ runner.temp }}/ccdc-results
          retention-days: 14
